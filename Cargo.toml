[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/app_analyzer",
  "crates/app_builder",
  "crates/app_packager",
  "crates/app_publisher",
  "crates/dmg_maker",
  "crates/stores/app_store_connect",
  "crates/stores/app_gallery_connect",
  "crates/stores/google_play_console",
  "apps/cli",
  "crates/studio-core",
  "apps/studio-cli",
  "apps/studio-api",
]

# The Studio Worker is checked separately for wasm32-unknown-unknown.
default-members = [
  "crates/core",
  "crates/app_analyzer",
  "crates/app_builder",
  "crates/app_packager",
  "crates/app_publisher",
  "crates/dmg_maker",
  "crates/stores/app_store_connect",
  "crates/stores/app_gallery_connect",
  "crates/stores/google_play_console",
  "apps/cli",
  "crates/studio-core",
  "apps/studio-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["LiJianying <lijy91@foxmail.com>"]
license = "MIT"

[workspace.dependencies]
studio-core = { path = "crates/studio-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
